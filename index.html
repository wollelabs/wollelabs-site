<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WolleLabs</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2e3a47;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    /* ── Page layout: image+tile in row, brand below image ── */
    .layout {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto;
      column-gap: 28px;
      row-gap: 20px;
    }

    /* ── Main WolleLabs image ── */
    .main-image {
      grid-column: 1;
      grid-row: 1;
      max-width: 80vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: block;
    }

    /* ── Brand text ── */
    .brand {
      grid-column: 1;
      grid-row: 2;
      font-family: 'Exo 2', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      color: #f0ebe0;
      text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.4);
      letter-spacing: 6px;
      text-transform: uppercase;
      text-align: center;
    }

    /* ── Demo tile column ── */
    .demo-tile {
      grid-column: 2;
      grid-row: 1;
      align-self: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* ── App icon ── */
    .demo-tile .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    .demo-tile .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      transition: filter 0.3s ease;
    }

    .demo-tile:hover .icon-wrap img,
    .demo-tile.selected .icon-wrap img {
      filter: grayscale(0%);
    }

    .demo-tile:hover .icon-wrap,
    .demo-tile.selected .icon-wrap {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    /* ── App label ── */
    .demo-label {
      font-family: 'Exo 2', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: #7a8e9a;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .demo-tile:hover .demo-label,
    .demo-tile.selected .demo-label {
      color: #f0ebe0;
    }

    /* ── Options panel ── */
    .demo-options {
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      width: 100%;
    }

    .demo-tile:hover .demo-options,
    .demo-tile.selected .demo-options {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }

    .demo-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #c8d8e4;
      text-decoration: none;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .demo-option i {
      font-size: 0.75rem;
      width: 12px;
      text-align: center;
    }

    .demo-option:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #f0ebe0;
    }
  </style>
</head>
<body>

  <div class="layout">

    <img class="main-image" src="img/wollelabs.png" alt="WolleLabs">

    <div class="brand">WolleLabs</div>

    <div class="demo-tile" id="tile-snooptheday">
      <div class="icon-wrap">
        <img src="img/snooptheday.png" alt="SnoopTheDay">
      </div>
      <div class="demo-label">SnoopTheDay</div>
      <div class="demo-options">
        <a class="demo-option" href="https://play.google.com/store/apps/details?id=de.wollelabs.snooptheday" target="_blank">
          <i class="fa-brands fa-google-play"></i> Play Store
        </a>
        <a class="demo-option" href="http://wollelabs.de/snooptheday/demo/" target="_blank">
          <i class="fa-solid fa-play"></i> Demo
        </a>
        <a class="demo-option" href="http://wollelabs.de/snooptheday/doc/privacypolicy.html" target="_blank">
          <i class="fa-solid fa-shield-halved"></i> Privacy
        </a>
      </div>
    </div>

  </div>

  <script>
    document.querySelectorAll('.demo-tile').forEach(tile => {
      tile.addEventListener('click', e => {
        if (e.target.closest('.demo-option')) return;
        const isSelected = tile.classList.contains('selected');
        document.querySelectorAll('.demo-tile').forEach(t => t.classList.remove('selected'));
        if (!isSelected) tile.classList.add('selected');
      });
    });
  </script>

</body>
</html>
