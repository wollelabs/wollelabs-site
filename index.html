<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WolleLabs</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #fef3e2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
    }

    /* ── Main WolleLabs image ── */
    .main-image {
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      display: block;
    }

    /* ── Brand text ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 500px;
    }

    .brand span {
      font-family: 'Exo 2', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: #1c0a00;
      text-shadow: 2px 3px 6px rgba(160, 74, 32, 0.35), 0 1px 2px rgba(0, 0, 0, 0.15);
      letter-spacing: 10px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand::before,
    .brand::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #d46b3055);
    }

    .brand::after {
      background: linear-gradient(to left, transparent, #d46b3055);
    }

    /* ── App tiles row ── */
    .app-tiles {
      width: 100%;
      max-width: 500px;
    }

    /* ── Demo tile: wraps icon col + options col in a row ── */
    .demo-tile {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    /* ── Icon + label column ── */
    .tile-icon-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      transition: filter 0.3s ease;
    }

    .demo-tile:hover .icon-wrap img,
    .demo-tile.selected .icon-wrap img {
      filter: grayscale(0%);
    }

    .demo-tile:hover .icon-wrap,
    .demo-tile.selected .icon-wrap {
      box-shadow: 0 4px 16px rgba(212, 107, 48, 0.3);
    }

    .demo-label {
      font-family: 'Exo 2', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #a04a20;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .demo-tile:hover .demo-label,
    .demo-tile.selected .demo-label {
      color: #1c0a00;
    }

    /* ── Options panel ── */
    .demo-options {
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .demo-tile:hover .demo-options,
    .demo-tile.selected .demo-options {
      opacity: 1;
      pointer-events: all;
      transform: translateX(0);
    }

    .demo-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 7px;
      background: rgba(212, 107, 48, 0.08);
      border: 1px solid #fed7aa;
      color: #a04a20;
      text-decoration: none;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .demo-option i {
      font-size: 0.75rem;
      width: 12px;
      text-align: center;
    }

    .demo-option:hover {
      background: rgba(212, 107, 48, 0.18);
      color: #1c0a00;
    }
  </style>
</head>
<body>

  <img class="main-image" src="img/wollelabs.png" alt="WolleLabs">

  <div class="brand"><span>WolleLabs</span></div>

  <div class="app-tiles">
    <div class="demo-tile" id="tile-snooptheday">

      <div class="tile-icon-col">
        <div class="icon-wrap">
          <img src="img/snooptheday.png" alt="SnoopTheDay">
        </div>
        <div class="demo-label">SnoopTheDay</div>
      </div>

      <div class="demo-options">
        <a class="demo-option" href="https://play.google.com/store/apps/details?id=de.wollelabs.snooptheday" target="_blank">
          <i class="fa-brands fa-google-play"></i> Play Store
        </a>
        <a class="demo-option" href="http://wollelabs.de/snooptheday/demo/" target="_blank">
          <i class="fa-solid fa-play"></i> Demo
        </a>
        <a class="demo-option" href="https://wollelabs.github.io/wollelabs-site/snooptheday/doc/about.html" target="_blank">
          <i class="fa-solid fa-circle-info"></i> About
        </a>
      </div>

    </div>
  </div>

  <script>
    let isTouchDevice = false;

    document.querySelectorAll('.demo-tile').forEach(tile => {

      // Touch: use touchend directly and suppress synthetic mouse events
      tile.addEventListener('touchend', e => {
        isTouchDevice = true;
        if (e.target.closest('.demo-option')) return; // let links work normally
        e.preventDefault(); // suppress synthetic mouseenter/click
        const isSelected = tile.classList.contains('selected');
        document.querySelectorAll('.demo-tile').forEach(t => t.classList.remove('selected'));
        if (!isSelected) tile.classList.add('selected');
      });

      // Mouse hover (desktop only)
      tile.addEventListener('mouseenter', () => {
        if (isTouchDevice) return;
        tile.classList.add('selected');
      });

      tile.addEventListener('mouseleave', () => {
        if (isTouchDevice) return;
        tile.classList.remove('selected');
      });

    });

    // Deselect all tiles when returning to tab (e.g. after opening a link)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        document.querySelectorAll('.demo-tile').forEach(t => t.classList.remove('selected'));
      }
    });
  </script>

</body>
</html>
