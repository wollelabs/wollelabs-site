<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
      background-color: #2e3a47;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
 
    img {
      max-width: 80%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <img src="img/wollelabs.png" alt="Centered Image">
</body>
</html>
