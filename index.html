<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Image</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
      background-color: #2e3a47;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
 
    body {
      flex-direction: column;
      gap: 24px;
    }

    img {
      max-width: 80%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      font-family: 'Exo 2', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      color: #f0ebe0;
      text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.4);
      letter-spacing: 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <img src="img/wollelabs.png" alt="Centered Image">
  <div class="brand">WolleLabs</div>
</body>
</html>
